spring:
  application:
    name: webwallet-backend
  config:
    import: "classpath:default-display-config.yml"
  datasource:
    url: jdbc:mysql://localhost:3311/fides_bluepages
    username: root
    password: my_password
  flyway:
    url: jdbc:mysql://localhost:3311/fides_bluepages
    user: root
    password: my_password
    create-schemas: true
  security.oauth2.resourceserver.jwt.issuer-uri: https://iam.acc.credenco.com/realms/fides
  docker:
    compose:
      enabled: true
      lifecycle-management: start_only
  threads:
    virtual:
      enabled: true
  jpa:
    show-sql: false
management:
  server:
    port: 9189
server:
  port: 8089
logging:
  level:
    community.fides: DEBUG
    community.fides.bluepages:
      backend:
        service:
          ExclusiveLockService: INFO

externalServices:
  organizational-wallet:
    apiKey: tsh7ugwBfY3a1fE90w9aWnwg90A04
    apiBaseUrl: http://localhost:8088/api

crawler:
  ebsi-api-crawler-enabled: false

mock-organizational-wallet-config:
  trustedIssuerList:
    -
      credentialType: KVKRegistration
      trustedDids:
        -
          did: did:web:mijnkvk.acc.credenco.com:did:df63abc0-2cc9-49e5-b3f8-42a824ceb9a7
    -
      credentialType: Omzetbelasting
      trustedDids:
        -
          did: did:web:wallet.acc.credenco.com:did:bd064799-e498-4020-a427-1c50710d2ac0
  verifiablePresentationStatus:
    overallStatus: VALID
    statusPerCredential:
      ContactInfo:
        verifiablePresentationStatus: VALID
        policyResults:
          -
            policyName: "expired"
            policyDescription: "Verifies that the credentials expiration date (`exp` for JWTs) has not been exceeded."
